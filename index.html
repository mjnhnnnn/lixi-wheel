<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vòng Quay Lì Xì May Mắn 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: url('https://thumbs.dreamstime.com/b/red-envelopes-falling-gold-coins-festive-background-packets-wealth-concept-d-render-chinese-new-year-promotion-437589863.jpg') center/cover no-repeat fixed;
      color: gold;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
    }
    h1 {
      font-size: 1.5rem;
      text-shadow: 3px 3px 10px black;
      margin-bottom: 10px;
    }
    #wheel-container {
      position: relative;
      margin: 10px 20px;
    }
    canvas {
      border-radius: 50%;
      box-shadow: 0 0 30px gold;
    }
    #pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 60px;
      color: gold;
      text-shadow: 0 0 10px black;
      pointer-events: none;
      z-index: 10;
    }
    #spin {
      padding: 15px 40px;
      font-size: 1.8rem;
      background: gold;
      color: red;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px black;
      margin-top: 10px;
      transition: all 0.2s ease;
    }
    #spin:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px black;
    }
    #spin:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      background: gray;
    }
    #result-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 30;
    }
    #result-modal h2 {
      font-size: 2rem;
      margin-bottom: 20px;
    }
    #result-modal p {
      font-size: 1.5rem;
      margin: 20px;
      margin-bottom: 40px;
    }
    #close-modal {
      padding: 10px 30px;
      font-size: 1.5rem;
      background: gold;
      color: red;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }
    canvas:not(#wheel) {
      display: none !important;
    }
  </style>
</head>
<body>

<h1>Vòng Quay Lì Xì May Mắn 2026</h1>

<div id="wheel-container">
  <div id="pointer">▼</div>
  <canvas id="wheel"></canvas>
</div>

<button id="spin">Quay Ngay!</button>

<div id="result-modal">
  <h2>Chúc Mừng Năm Mới 2026!</h2>
  <p>Bạn nhận được lì xì <span id="prize-amount"></span> 🎉🎉</p>
  <button id="close-modal">Quay Lại</button>
</div>

<script>
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const spinBtn = document.getElementById('spin');
const resultModal = document.getElementById('result-modal');
const prizeAmount = document.getElementById('prize-amount');
const closeModal = document.getElementById('close-modal');

/* ======= PRIZES - CẬP NHẬT CHO VÒNG QUAY ======= */
const prizes = [
  { text: '10.000đ', color: '#FF0000' },    // Đỏ
  { text: '20.000đ', color: '#FFD700' },    // Vàng
  { text: '50.000đ', color: '#DAA520' },    // Nâu vàng
  { text: '1.000.000đ', color: '#FF1493' }, // Hồng
  { text: '5.000.000đ', color: '#000000' }  // Đen
];

// Vòng quay được chia ĐỀU 5 phần
const numSegments = prizes.length;
const anglePerSegment = (Math.PI * 2) / numSegments;

const segments = [];
for (let i = 0; i < numSegments; i++) {
  segments.push({
    text: prizes[i].text,
    color: prizes[i].color,
    index: i,
    start: i * anglePerSegment,
    end: (i + 1) * anglePerSegment
  });
}

let currentRotation = 0;
let isSpinning = false;

/* ======= LOGIC XỬ LÝ GIẢI THƯỞNG CLIENT-SIDE ======= */
let count50k = 0;
const MAX_50K = 2;

// Hàm lấy prizes dựa trên số lần đã trúng 50k
function getPrizesByCount() {
  if (count50k >= MAX_50K) {
    // Đã trúng đủ 2 lần 50k -> chỉ còn 10k và 20k, mỗi loại 50%
    return [
      { text: "10.000đ", prob: 50 },
      { text: "20.000đ", prob: 50 },
      { text: "50.000đ", prob: 0 },
      { text: "1.000.000đ", prob: 0 },
      { text: "5.000.000đ", prob: 0 }
    ];
  } else {
    // Chưa đủ 2 lần 50k -> tỷ lệ như yêu cầu
    return [
      { text: "10.000đ", prob: 40 },
      { text: "20.000đ", prob: 40 },
      { text: "50.000đ", prob: 20 },
      { text: "1.000.000đ", prob: 0 },
      { text: "5.000.000đ", prob: 0 }
    ];
  }
}

function getRandomPrize() {
  const currentPrizes = getPrizesByCount();
  
  // Tính tổng xác suất
  const totalProb = currentPrizes.reduce((sum, p) => sum + p.prob, 0);
  
  // Random
  let rand = Math.random() * totalProb;
  let cum = 0;

  for (const p of currentPrizes) {
    cum += p.prob;
    if (rand < cum) {
      // Nếu trúng 50k thì tăng biến đếm
      if (p.text === "50.000đ") {
        count50k++;
      }
      return p.text;
    }
  }

  return "10.000đ"; // fallback
}

function resizeCanvas() {
  const size = Math.min(window.innerWidth * 0.85, window.innerHeight * 0.7);
  canvas.width = size;
  canvas.height = size;
  drawWheel();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function drawWheel() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = cx - 30;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(currentRotation);

  segments.forEach(seg => {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, radius, seg.start, seg.end);
    ctx.closePath();
    ctx.fillStyle = seg.color;
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 3;
    ctx.stroke();

    const mid = seg.start + (seg.end - seg.start)/2;
    ctx.save();
    ctx.rotate(mid);
    ctx.textAlign = 'center';
    ctx.fillStyle = 'white';
    ctx.font = `bold ${canvas.width/25}px Arial`;
    ctx.textBaseline = 'middle';
    ctx.fillText(seg.text, radius * 0.65, 0);
    ctx.restore();
  });

  ctx.restore();

  ctx.beginPath();
  ctx.arc(cx, cy, 40, 0, Math.PI*2);
  ctx.fillStyle = '#222';
  ctx.fill();
}

spinBtn.onclick = () => {
  if (isSpinning) return;

  isSpinning = true;
  spinBtn.disabled = true;
  resultModal.style.display = 'none';

  // Reset góc quay về 0-2PI để tránh cộng dồn
  currentRotation = currentRotation % (Math.PI * 2);

  // Lấy kết quả từ function client-side
  setTimeout(() => {
    const winningText = getRandomPrize();

    // Tìm index của ô thắng (dựa trên text)
    let winningIndex = prizes.findIndex(p => p.text === winningText);
    if (winningIndex === -1) {
      winningIndex = 0; // Fallback về 10.000đ nếu lỗi
    }

    // Lấy segment tương ứng
    const winningSeg = segments[winningIndex];
    const segMidAngle = winningSeg.start + (winningSeg.end - winningSeg.start)/2;
    const pointerAngle = Math.PI/2; // Kim chỉ xuống dưới

    const extraSpins = 6 + Math.floor(Math.random() * 4); // 6-9 vòng

    // Tính target rotation: đưa ô thắng về dưới kim
    const targetRotation = 
      extraSpins * Math.PI * 2 +
      (Math.PI * 2 - segMidAngle - pointerAngle);

    const duration = 6000;
    const start = Date.now();
    const startRotation = currentRotation;

    function animate() {
      const progress = Math.min((Date.now()-start)/duration,1);
      const ease = 1 - Math.pow(1-progress,4);

      currentRotation = startRotation + (targetRotation - startRotation) * ease;
      drawWheel();

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        isSpinning = false;
        prizeAmount.textContent = winningText;
        resultModal.style.display = 'flex';

        // Hiệu ứng confetti theo giá trị giải
        let particle = 150;
        let spread = 70;

        if (winningText === '50.000đ') { 
          particle = 300; 
          spread = 80; 
        }
        if (winningText === '1.000.000đ') { 
          particle = 600; 
          spread = 100; 
        }
        if (winningText === '5.000.000đ') { 
          particle = 1200; 
          spread = 150; 
        }

        confetti({
          particleCount: particle,
          spread: spread,
          origin: { y: 0.6 }
        });

        spinBtn.disabled = false;
      }
    }
    animate();
  }, 100); // Delay nhỏ để giả lập network
};

closeModal.onclick = () => {
  resultModal.style.display = 'none';
  spinBtn.disabled = false;
};

drawWheel();
</script>

</body>
</html>
